{% extends 'base.html' %}
{% block content %}
<h3 class="fw-bold mb-4">إغلاق تذكرة صيانة #{{ log.id }}</h3>
<div class="card p-3">
    <p><b>المعدة:</b> {{ log.asset_code }} - {{ log.asset_name }}</p>
    <p><b>الوصف:</b> {{ log.action_taken }}</p>
    <form method="POST">
        <div class="row g-3">
            <div class="col-md-12">
                <label>الأعمال / المهام المنفذة:</label>
                <textarea name="action_taken" class="form-control" rows="3" required>{{ log.action_taken or '' }}</textarea>
            </div>
            <div class="col-md-6">
                <label>قطع الغيار المستبدلة:</label>
                <input type="text" name="spare_parts" class="form-control" value="{{ log.spare_parts or '' }}">
            </div>
            <div class="col-md-6">
                <label>الفني:</label>
                <input type="text" name="technician" class="form-control" value="{{ current_user.username }}">
            </div>
            <div class="col-md-6">
                <label>التكلفة (ج.م):</label>
                <input type="number" step="0.01" name="cost" class="form-control" value="{{ log.cost or 0 }}">
            </div>
        </div>
        <div class="mt-3">
            <button type="submit" class="btn btn-success btn-custom"><i class="fa-solid fa-check"></i> إغلاق التذكرة</button>
            <a href="/tickets" class="btn btn-secondary btn-custom">إلغاء</a>
        </div>
    </form>
</div>
{% endblock %}
