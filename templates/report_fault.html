{% extends 'base.html' %}
{% block content %}
<h3 class="fw-bold mb-4">الإبلاغ عن عطل في معدة</h3>
<div class="card p-3">
    <form method="POST">
        <div class="row g-3">
            <div class="col-md-6">
                <label>كود المعدة:</label>
                <select name="asset_code" class="form-select" required>
                    <option value="">-- اختر معدة --</option>
                    {% for a in assets %}
                    <option value="{{ a.asset_code }}">{{ a.asset_code }} - {{ a.asset_name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-md-6">
                <label>اسم المبلّغ:</label>
                <input type="text" name="reporter_name" class="form-control" placeholder="اسمك (اختياري)">
            </div>
            <div class="col-md-12">
                <label>وصف العطل:</label>
                <textarea name="description" class="form-control" rows="3" required></textarea>
            </div>
        </div>
        <div class="mt-3">
            <button type="submit" class="btn btn-danger btn-custom"><i class="fa-solid fa-triangle-exclamation"></i> إرسال البلاغ</button>
        </div>
    </form>
</div>
{% endblock %}
